name: Publish axios-kit-ts to npm

on:
  push:
    tags:
      - 'v*' # v1.0.0 같은 태그를 푸시하면 실행

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'

      # npm ci: 재현성 고정 설치 (npm install 대비 lockfile 엄격 준수)
      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build # 빌드 스크립트가 있다면 실행

      # --ignore-scripts: 공급망 공격 방어(설치 시 임의 스크립트 실행 차단).
      # 위 Build project 스텝이 dist를 이미 만들어 두므로 prepublishOnly가 무력화돼도 안전하다.
      # 이 주석을 지우고 --ignore-scripts만 제거하지 말 것 — Build project 스텝과 반드시 세트로 유지한다.
      - name: Publish to npm
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
